<style>
  .lm { padding: 2px 2px 8px; color: #2b3245; }
  .lm-field { margin-bottom: 15px; }
  .lm-field label { display: block; font-size: 13px; font-weight: 600; color: #1b2238; margin-bottom: 6px; }
  .lm-field input {
    width: 100%; box-sizing: border-box; padding: 11px 13px; font-size: 15px;
    border-radius: 10px; border: 1px solid rgba(20, 26, 46, 0.16);
    background: #f9fafc; color: #1b2238;
  }
  .lm-field input:focus { outline: none; border-color: #2d8cff; background: #fff; }
  .lm-note { margin: 6px 0 0; padding: 0; text-align: left; line-height: 1.45; }
  .lm-status { font-size: 13px; color: #2d8cff; margin: 6px 2px 0; min-height: 16px; }
  .lm-error { font-size: 13px; color: #e4002b; margin: 6px 2px 0; min-height: 16px; white-space: pre-wrap; }
  .lm-submit { width: 100%; box-sizing: border-box; margin-top: 8px; }

  .lm-pin {
    position: relative; display: flex; justify-content: space-between; gap: 8px;
    max-width: 196px;
  }
  .lm-pin-box {
    flex: 1 1 0; height: 42px; display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 700; color: #1b2238;
    border-radius: 10px; border: 1px solid rgba(20, 26, 46, 0.16);
    background: #f9fafc;
    -webkit-user-select: none; user-select: none;
  }
  .lm-pin.lm-focus .lm-pin-box { border-color: #2d8cff; background: #fff; }
  .lm-pin-box.lm-filled { border-color: #2d8cff; }
  .lm-pin-dot { width: 8px; height: 8px; border-radius: 50%; background: #1b2238; }
  .lm-pin-input {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    opacity: 0; border: 0; padding: 0; margin: 0; background: transparent;
    font-size: 15px; letter-spacing: 28px; caret-color: transparent; color: transparent;
    -webkit-text-security: disc;
  }
</style>

<div class="lm">
  <div class="lm-field">
    <label for="username">Leapmotor e-mail</label>
    <input id="username" type="email" autocomplete="username" autocapitalize="none" spellcheck="false" />
  </div>

  <div class="lm-field">
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" />
  </div>

  <div class="lm-field">
    <label for="pin">PIN (PIN=Control)</label>
    <div id="pinWrap" class="lm-pin">
      <div class="lm-pin-box" data-index="0"></div>
      <div class="lm-pin-box" data-index="1"></div>
      <div class="lm-pin-box" data-index="2"></div>
      <div class="lm-pin-box" data-index="3"></div>
      <input id="pin" class="lm-pin-input" type="text" inputmode="numeric" pattern="[0-9]*"
             autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
             maxlength="4" aria-label="Vehicle PIN" enterkeyhint="done" />
    </div>
    <p class="lm-note">You may leave it blank and add it later in the settings</p>
  </div>

  <p id="status" class="lm-status"></p>
  <p id="error" class="lm-error"></p>

  <button id="submit" class="homey-button-primary-full lm-submit">Sign in</button>
</div>

<script type="application/javascript">
  var submitButton = document.getElementById('submit');
  var errorLabel = document.getElementById('error');
  var statusLabel = document.getElementById('status');
  var busy = false;

  var pinInput = document.getElementById('pin');
  var pinWrap = document.getElementById('pinWrap');
  var pinBoxes = pinWrap.querySelectorAll('.lm-pin-box');

  function sanitisePin(value) {
    return String(value == null ? '' : value).replace(/\D/g, '').slice(0, 4);
  }

  function renderPin() {
    var value = sanitisePin(pinInput.value);
    if (pinInput.value !== value) pinInput.value = value;
    for (var i = 0; i < pinBoxes.length; i++) {
      var box = pinBoxes[i];
      if (i < value.length) {
        if (!box.firstChild) {
          var dot = document.createElement('span');
          dot.className = 'lm-pin-dot';
          box.appendChild(dot);
        }
        box.classList.add('lm-filled');
      } else {
        while (box.firstChild) box.removeChild(box.firstChild);
        box.classList.remove('lm-filled');
      }
    }
  }

  pinInput.addEventListener('input', renderPin);
  pinInput.addEventListener('focus', function () { pinWrap.classList.add('lm-focus'); });
  pinInput.addEventListener('blur', function () { pinWrap.classList.remove('lm-focus'); });
  pinInput.addEventListener('keydown', function (event) {
    if (event.key === 'Enter') {
      event.preventDefault();
      signIn();
    }
  });
  pinWrap.addEventListener('click', function () {
    if (document.activeElement !== pinInput) pinInput.focus();
  });
  renderPin();

  function safe(fn) { try { return fn(); } catch (err) { return undefined; } }

  function value(id) {
    var el = document.getElementById(id);
    return el && el.value ? el.value.trim() : '';
  }

  function readForm() {
    var passwordEl = document.getElementById('password');
    return {
      username: value('username'),
      password: passwordEl ? passwordEl.value : '',
      pin: sanitisePin(pinInput.value)
    };
  }

  function emit(event, data) {
    return new Promise(function (resolve, reject) {
      var settled = false;
      function done(err, result) {
        if (settled) return;
        settled = true;
        if (err) reject(err); else resolve(result);
      }
      try {
        var maybePromise = Homey.emit(event, data, done);
        if (maybePromise && typeof maybePromise.then === 'function') {
          maybePromise.then(function (result) { done(null, result); }, function (err) { done(err); });
        }
      } catch (err) { done(err); }
      setTimeout(function () {
        done(new Error('The Leapmotor app did not answer within 120 seconds. Check the app logs in Homey Developer Tools.'));
      }, 120000);
    });
  }

  function describe(err) {
    if (!err) return 'Unknown error';
    if (typeof err === 'string') return err;
    return err.message || err.error || JSON.stringify(err);
  }

  var syncTimer = null;
  function scheduleSync() {
    if (syncTimer) clearTimeout(syncTimer);
    syncTimer = setTimeout(function () {
      emit('credentials', readForm()).catch(function () {});
    }, 300);
  }

  function signIn() {
    if (busy) return;
    var form = readForm();

    errorLabel.textContent = '';
    if (!form.username || !form.password) {
      errorLabel.textContent = 'Please fill in both your Leapmotor e-mail address and your password.';
      return;
    }
    if (form.pin.length !== 0 && form.pin.length !== 4) {
      errorLabel.textContent = 'The vehicle PIN must be exactly 4 digits, or left blank.';
      return;
    }

    busy = true;
    submitButton.disabled = true;
    submitButton.textContent = 'Signing in...';
    statusLabel.textContent = 'Contacting the Leapmotor cloud, this can take up to a minute on an older Homey...';
    safe(function () { Homey.showLoadingOverlay(); });

    emit('login', form)
      .then(function (result) {
        safe(function () { Homey.hideLoadingOverlay(); });
        if (result && Array.isArray(result.vehicles)) {
          statusLabel.textContent = 'Signed in. Found ' + result.count + ' vehicle(s): '
            + result.vehicles.map(function (v) { return v.vehicleName || v.vin; }).join(', ')
            + '. Press Next to choose an icon.';
        } else {
          statusLabel.textContent = 'Signed in. Press Next to choose an icon.';
        }
        busy = false;
        submitButton.disabled = false;
        submitButton.textContent = 'Sign in';
      })
      .catch(function (err) {
        safe(function () { Homey.hideLoadingOverlay(); });
        var message = describe(err);
        statusLabel.textContent = '';
        errorLabel.textContent = message;
        safe(function () { Homey.alert(message, 'error'); });
        busy = false;
        submitButton.disabled = false;
        submitButton.textContent = 'Sign in';
      });
  }

  submitButton.addEventListener('click', signIn);

  var inputs = document.querySelectorAll('input');
  for (var i = 0; i < inputs.length; i++) {
    inputs[i].addEventListener('input', scheduleSync);
    inputs[i].addEventListener('change', scheduleSync);
  }

  safe(function () {
    Homey.on('pair_error', function (message) {
      errorLabel.textContent = message;
    });
  });

  safe(function () { Homey.setTitle('Sign in'); });
  safe(function () { Homey.ready(); });
</script>
